name: Oi racing paper-pick monitor
on:
  schedule:
    # 12:00〜21:59 JST, 5分おき。GitHub側の遅延・欠落の可能性があります。
    - cron: '*/5 3-12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oi-racing-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 公式ZIPの確認と紙上買い目通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py
      - name: 送信済み状態の保存
        if: success()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "oi-monitor-bot"
            git config user.email "oi-monitor-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update monitor notification state [skip ci]"
            git pull --rebase
            git push
          fi
